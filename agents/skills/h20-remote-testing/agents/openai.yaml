interface:
  display_name: "H20 Remote Testing"
  short_description: "Run vLLM tests on the SGP H20e Slurm cluster"
  default_prompt: "使用远程H20验证这个改动：先跑共享的 pre-commit + DCO 检查（$HOME/vllm-shared/scripts/run-precommit.sh，必须退出码为 0），复用 $HOME/vllm-shared 的共享环境（prebuilt-venv），模型缓存用节点本地共享缓存 /mnt/scratch/hf-hub，再在 SGP H20e 集群的 job 节点里跑测试，最后把命令与结果 comment 到对应 PR。"
