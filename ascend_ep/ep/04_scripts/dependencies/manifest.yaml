  commit: null
  license: PSF-2.0
  optional: false
  installable: false
  install_reason: The interpreter comes from the image or from the venv the operator creates; it is not
    a wheel, and installing a second interpreter inside a running environment would silently change what
    ``python`` means to the launcher.
  manual_step: Provision CPython 3.10-3.12 (pyenv 3.10.8, the distribution package, or the CPU venv at
    ascend_ep/ep/.cpu-venv) and run every command from the SCRIPTS root so that ``common``, ``baselines``
    and ``operators`` resolve.
  install:
  - Provision CPython 3.10-3.12 (pyenv 3.10.8, the distribution package, or the CPU venv at ascend_ep/ep/.cpu-venv)
    and run every command from the SCRIPTS root so that ``common``, ``baselines`` and ``operators`` resolve.
  check:
    type: python_version
  runtime_paths:
  - <sys.executable>
  - $VIRTUAL_ENV
  supported_soc:
  - '*'
  supported_cann:
  - '*'
  notes: pyproject.toml declares requires-python >=3.10; 3.13 is excluded because the pinned torch 2.6
    release has no 3.13 CPU wheel.  The code uses ``str | None`` annotations, so 3.9 is genuinely unsupported.
  manual_step_owner: host image
  ownership: host
  environment: base
  modules: []
  pin:
    kind: none
    value: null
    verify: null
  conflicts: []
  install_spec:
    mode: manual
    manual: Provision CPython 3.10-3.12 (pyenv 3.10.8, the distribution package, or the CPU venv at ascend_ep/ep/.cpu-venv)
      and run every command from the SCRIPTS root so that ``common``, ``baselines`` and ``operators``
      resolve.
    verify:
    - echo 'manual step required; see manual_step'
