  - id: hccl
    category: B
    kind: host_provided
    version: ">=8.1.RC1"
    required_by: [l0_transport, l0_collectives, l0_hardware, l0_overlap, *ops_npu]
    source_url: https://gitcode.com/cann/hccl
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      libhccl.so is part of the CANN toolkit.  Copying a single .so between hosts
      produces ABI drift against libascendcl; the fix is to install or upgrade
      CANN on the host.
    manual_step: >-
      Install or upgrade the CANN toolkit on the host, re-source
      set_env.sh on every rank, and confirm libhccl.so resolves (LD_LIBRARY_PATH
      must contain $ASCEND_HOME_PATH/lib64).
    install:
      - "# comes with the CANN toolkit; verify, do not copy:"
      - "python -c \"import ctypes.util; print(ctypes.util.find_library('hccl'))\""
    check:
      type: shared_library
      names: [libhccl.so, libhccl.dll]
    runtime_paths:
      - $ASCEND_HOME_PATH/lib64
      - $ASCEND_HOME_PATH/runtime/lib64
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      Every collective result depends on this library resolving at run time; the
      probe reports both ctypes.util.find_library and an explicit LD_LIBRARY_PATH
      scan because find_library ignores LD_LIBRARY_PATH on several platforms.
    manual_step_owner: host

  - id: npu-smi
    category: B
    kind: binary
    version: ">=24.1.RC1"
    required_by: [l0_topology, profiling]
    source_url: https://www.hiascend.com/cann
    commit: null
    license: Proprietary (Huawei)
    optional: false
    installable: false
    install_reason: >-
      npu-smi is installed by the NPU driver package under
      /usr/local/Ascend/driver/tools.  It is a host tool with no pip equivalent.
    manual_step: >-
      Install the NPU driver on the host; npu-smi arrives with it.  Inside the
      container it is visible only if /usr/local/Ascend/driver is bind-mounted.
    install:
      - "# host only, part of the driver package: ls /usr/local/Ascend/driver/tools/npu-smi"
      - "npu-smi info"
    check:
      type: binary
      binary: npu-smi
      version_args: ["--version"]
      parse: npu_smi
      extra_paths:
        - /usr/local/Ascend/driver/tools
    runtime_paths:
      - /usr/local/Ascend/driver/tools
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      The SoC name is parsed from ``npu-smi info`` output and recorded with its
      raw source.  When npu-smi is absent the SoC stays unknown: the doctor does
      not fall back to a constant.
    manual_step_owner: host

  - id: ascendc-toolchain
    category: B
    kind: host_provided
    version: ">=8.1.RC1"
    required_by: [l0_transport, l0_overlap, "operator:mc2_dispatch_cann_v3", "operator:megamoe_cann"]
    source_url: https://www.hiascend.com/cann
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      ccec (the Ascend C compiler) ships inside the CANN toolkit under
      compiler/ccec_compiler/bin.  There is no standalone package, and a
      mismatched compiler produces kernels the runtime rejects at load time.
    manual_step: >-
      Install the CANN toolkit on the host, source set_env.sh, then verify
      ``ccec --version`` resolves.  Custom Ascend C builds (ops-transformer,
      ASC-COMM) cannot run without it.
    install:
      - "# comes with the CANN toolkit: source $ASCEND_HOME_PATH/set_env.sh"
      - "ccec --version"
    check:
      type: toolchain
      binaries: [ccec]
      env: [ASCEND_HOME_PATH]
      subdirs:
        - compiler/ccec_compiler/bin
        - compiler/bin
    runtime_paths:
      - $ASCEND_HOME_PATH/compiler/ccec_compiler/bin
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      The compiler is a host-installed CANN component even when the build runs in
      a container; bind-mounting /usr/local/Ascend is the supported pattern.
    manual_step_owner: host

