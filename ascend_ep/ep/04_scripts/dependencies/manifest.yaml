    - /dev/davinci_manager
    - /dev/devmm_svm
    access: rw
    minimum: 1
  runtime_paths:
  - /dev/davinci0
  - /dev/davinci_manager
  - /dev/devmm_svm
  supported_soc:
  - Ascend910B
  - Ascend910_93
  - Ascend950
  supported_cann:
  - 8.1.RC1
  - 8.2.RC1
  - 8.3.RC1
  notes: 'The probe opens nothing and writes nothing: it checks existence and os.access(R_OK | W_OK).  A
    readable-but-not-writable node is reported as warn with the exact missing bit, because a run would
    fail much later while creating a context.'
  manual_step_owner: host
  ownership: host
  environment: base
  modules: []
  pin:
    kind: none
  conflicts: []
