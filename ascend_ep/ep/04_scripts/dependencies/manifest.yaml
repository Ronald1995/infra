  # -- B. CANN runtime, toolkit and the PyTorch device bridge --------------
  - id: npu-driver
    category: B
    kind: host_provided
    version: ">=24.1.RC1"
    required_by: *npu_only
    source_url: https://www.hiascend.com/hardware/firmware-drivers
    commit: null
    license: Proprietary (Huawei)
    optional: false
    installable: false
    install_reason: >-
      A driver is kernel code.  It must be installed on the host and cannot be
      installed, upgraded or reloaded from inside a container; pretending
      otherwise is how a container ends up with libascendcl and no devices.
    manual_step: >-
      On the host only: install Ascend-hdk-<soc>-npu-driver_<ver>_linux-*.run and
      the matching firmware, reset the devices, then confirm ``npu-smi info``
      lists the chips and /dev/davinci* exists.  Never run this from the
      container -- scripts/install_deps.sh refuses and prints this step.
    install:
      - "# host only, refused by this repository: ./Ascend-hdk-<soc>-npu-driver_<ver>_linux.run --full"
      - "npu-smi info   # host: after the driver reset"
    check:
      type: driver
      paths:
        - /usr/local/Ascend/driver/version.info
        - /usr/local/Ascend/driver
      devices:
        - /dev/davinci_manager
        - /dev/devmm_svm
    runtime_paths:
      - /usr/local/Ascend/driver/lib64
      - /usr/local/Ascend/driver/tools
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      Version floor only: driver and CANN are paired per vendor release, and this
      repository does not pin a driver revision.  The doctor records the observed
      version as evidence and never enforces the floor as a hard failure.
    manual_step_owner: host

  - id: cann-toolkit
    category: B
    kind: host_provided
    version: ">=8.1.RC1,<8.4"
    required_by: *npu_only
    source_url: https://www.hiascend.com/cann
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      The toolkit is a vendor .run package that installs under /usr/local/Ascend
      and links against the host driver.  Containers inherit it from the host
      image by bind mount; installing another copy inside the container would
      shadow the host's libascendcl.
    manual_step: >-
      On the host: verify the sha256 of Ascend-cann-toolkit_<ver>_linux-<arch>.run
      for the target SoC, run it with --install, then bind-mount /usr/local/Ascend
      into the container and ``source /usr/local/Ascend/ascend-toolkit/set_env.sh``.
    install:
      - "# host only: ./Ascend-cann-toolkit_8.2.RC1_linux-aarch64.run --install"
      - "source /usr/local/Ascend/ascend-toolkit/set_env.sh"
    check:
      type: cann_home
      version_file: version.cfg
    runtime_paths:
      - /usr/local/Ascend/ascend-toolkit/latest
      - $ASCEND_HOME_PATH/lib64
      - $ASCEND_HOME_PATH/runtime/lib64
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      The doctor reads the version from $ASCEND_HOME_PATH/version.cfg (or
      /usr/local/Ascend/ascend-toolkit/latest/version.cfg), reports the raw file
      as evidence, and refuses to guess when the file is absent.
    manual_step_owner: host

