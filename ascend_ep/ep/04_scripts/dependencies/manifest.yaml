# Third-party dependency catalog for the Ascend EP benchmark.
#
# Why a single machine-readable catalog: the runner already reports one status
# (``dependency_missing``) for six very different situations -- a wheel that is
# not installed, a CANN component that is not on the host, a driver that cannot
# exist in a container, a native kernel tree that was never built, a toolchain
# that is missing, and a device node the user cannot open.  Collapsing them into
# one status makes a CPU workstation and a broken Ascend node look alike.  Every
# entry below therefore carries what the dependency is, who needs it, how the
# doctor proves it is there, and whether the installer is even allowed to touch
# it.
#
# Conventions:
#   * ``categories`` A-E follow the refactor spec (python base / CANN /
#     communication / multinode / profiling).
#   * ``capability_groups`` is the closed vocabulary for ``required_by``.  A
#     group is a benchmark family (``l0_*``), a cross-cutting stage
#     (``profiling`` / ``reporting`` / ``multinode``) or one operator from
#     ``operators/registry.yaml``.  ``scripts/doctor.py`` derives the
#     availability matrix from these tokens, so a token that is not listed here
#     is a catalog bug, not a typo to ignore.
#   * ``required_by`` lists may be composed from the ``x-tokens`` anchors (a
#     nested list is flattened by the loader, order preserved, duplicates
#     removed).
#   * ``version`` is a constraint, never "latest".  A source build that is
#     pinned by commit uses the short commit as its version and repeats the full
#     hash in ``commit``.
#   * ``installable: false`` always carries ``install_reason``; a ``kind:
#     host_provided`` entry additionally carries ``manual_step`` (the exact
#     command a human must run) and ``manual_step_owner`` (``host`` /
#     ``host image`` / ``deployment``), because the only honest instruction for a
#     driver, a device permission or a site variable is the manual one.
#   * ``install`` commands are documentation for ``scripts/install_deps.sh`` and
#     for a human.  Lines starting with ``#`` are commentary, not commands.
schema_version: 1
maintained_by: scripts/doctor.py (probes) + scripts/install_deps.sh (installs)
matrix_owner: common/registry.py (operator ids must stay in sync)

vocabulary:
  check_status: [pass, warn, fail, skip]
  matrix_status: [available, degraded, blocked]
  kinds: [pip, native_build, host_provided, binary, python_import]
  check_types:
    - python_version
    - python_module
    - shared_library
    - binary
    - env_var
    - device_node
    - driver
    - cann_home
    - toolchain
    - ascendep_checkout
    - kernel_artifact

categories:
  A:
    id: python_base
    title: Python and CPU base stack
    installable_here: true
    note: The only category that must install offline on a CPU-only machine.
  B:
    id: cann
    title: CANN runtime, toolkit and the PyTorch device bridge
    installable_here: partial
    note: >-
      torch_npu and the ops packages are wheels or source builds; the driver, the
      toolkit, HCCL/HCOMM and npu-smi come from the host image and are never
      installed by this repository.
  C:
    id: communication
    title: Communication runtimes and custom kernels
    installable_here: partial
    note: >-
      SHMEM/DeepEP/npu_patch/MoonEP are source builds that need the target CANN
      toolkit; the ASC-COMM kernel tree is BLOCKED until the CANN ASC-COMM
      toolchain exists.
  D:
    id: multinode
    title: Multi-node launch and fabric
    installable_here: false
    note: MPI is a package; the environment, the HCCL configuration and the device permissions are deployment state.
  E:
    id: profiling
    title: Profiling and toolchain
    installable_here: false
    note: msprof and hccl_test ship inside CANN; the compiler toolchain comes from CANN plus the image's package manager.

# Profile -> dependency categories probed.  ``scripts/doctor.py`` keeps the same
# table in code; tests/dependencies/test_manifest_consistency.py refuses to let
# the two drift.
profiles:
  cpu: [A]
  npu: [A, B]
  communication: [A, B, C]
  profiling: [A, B, E]
  multinode: [A, B, D]
  all: [A, B, C, D, E]

