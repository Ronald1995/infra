  required_by:
  - l0_transport
  - l0_overlap
  source_url: kernels/asc_comm/ (in this repository)
  commit: null
  license: Same as this repository
  optional: false
  installable: false
  install_reason: 'BLOCKED: kernels/asc_comm/ exists, but its device programs (aiv/write_nbi/kernel.cpp
    and ccu/dsl/kernel.cpp) are not written, and the CANN ASC-COMM toolchain (toolkit headers plus the
    CCU DSL frontend) is not installed on any host reachable from this workstream.  build.sh exits non-zero
    with that blocker; it never produces a library whose symbols only return UNSUPPORTED.'
  manual_step: 'On an Ascend host that has the CANN ASC-COMM toolchain: source set_env.sh, write the device
    sources against the installed headers (checklists in kernels/asc_comm/aiv/README.md and kernels/asc_comm/ccu/README.md),
    then run ``bash kernels/asc_comm/build.sh --soc <soc>``.  The probe reads build/manifest.json, so
    a build that did not link stays missing; see dependencies/system/asc_comm.yaml for the blocker list.'
  install:
  - 'On an Ascend host that has the CANN ASC-COMM toolchain: source set_env.sh, write the device sources
    against the installed headers (checklists in kernels/asc_comm/aiv/README.md and kernels/asc_comm/ccu/README.md),
    then run ``bash kernels/asc_comm/build.sh --soc <soc>``.  The probe reads build/manifest.json, so
    a build that did not link stays missing; see dependencies/system/asc_comm.yaml for the blocker list.'
  check:
    type: kernel_artifact
    root: kernels/asc_comm
    build: build
    manifest: manifest.json
    libraries:
    - libasc_comm_kernels.so
    engines:
    - AIV
    - CCU
  runtime_paths:
  - kernels/asc_comm/build
  supported_soc:
  - Ascend910B
  - Ascend910_93
  - Ascend950
  supported_cann:
  - 8.2.RC1
  - 8.3.RC1
  notes: 'BLOCKED is recorded, not papered over: the entry exists so the matrix says why the transport
    family is degraded, instead of the case failing later as "unsupported by the adapter".  The artifact
    contract is the project''s own: build/manifest.json names the library per engine, and baselines/l0/transport/kernel_artifacts.py
    additionally resolves the ABI symbols declared in common/abi.h.'
  ownership: in_repo
  environment: base
  modules: []
  pin:
    kind: in_repo
    value: in-repo
  conflicts: []
  install_spec:
    mode: manual
    manual: 'On an Ascend host that has the CANN ASC-COMM toolchain: source set_env.sh, write the device
