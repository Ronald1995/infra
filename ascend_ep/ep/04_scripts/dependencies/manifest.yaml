      that tree.
    install:
      - "# provided by the ascendep checkout: see the ascendep-checkout entry"
    check:
      type: python_module
      module: mega_moe
      import: false
      requires_env: EP_ASCENDEP_ROOT
    runtime_paths:
      - $EP_ASCENDEP_ROOT
    supported_soc: [Ascend910B, Ascend910_93]
    supported_cann: ["8.2.RC1"]
    notes: >-
      bf16_mega_moe and MegaMoEFunction.apply are separate entry points over the
      same kernel, which is why megamoe_lueelu, megamoe_fsdpturbo and megamoe_td
      share this dependency.

  - id: ascendep-checkout
    category: C
    kind: python_import
    version: "24ff84d"
    required_by: *ops_ascendep
    source_url: https://github.com/penn513/ascendep
    commit: 24ff84d3ab8c01e1e2071802465173e624e1f89d
    license: Not declared upstream (research checkout); record the licence before redistribution
    optional: false
    installable: true
    install_reason: null
    manual_step: null
    install:
      - "git clone https://github.com/penn513/ascendep.git"
      - "git -C ascendep checkout 24ff84d3ab8c01e1e2071802465173e624e1f89d"
      - "export EP_ASCENDEP_ROOT=$PWD/ascendep"
    check:
      type: ascendep_checkout
      env: EP_ASCENDEP_ROOT
      commit: 24ff84d3ab8c01e1e2071802465173e624e1f89d
      marker: ep/runner.py
    runtime_paths:
      - $EP_ASCENDEP_ROOT
    supported_soc: [Ascend910B, Ascend910_93]
    supported_cann: ["8.2.RC1"]
    notes: >-
      operators/ascendep.py verifies both the commit and a clean ``ep/`` tree and
      reports source_unavailable otherwise; the doctor performs the same check so
      a dirty checkout is visible before a 18k-task run starts.

  - id: asc-comm-kernels
    category: C
    kind: native_build
    version: "ABI 1 (build id in build/manifest.json)"
    required_by: [l0_transport, l0_overlap]
    source_url: kernels/asc_comm/ (in this repository)
    commit: null
    license: Same as this repository
    optional: false
    installable: false
    install_reason: >-
      BLOCKED: kernels/asc_comm/ exists, but its device programs
      (aiv/write_nbi/kernel.cpp and ccu/dsl/kernel.cpp) are not written, and the
      CANN ASC-COMM toolchain (toolkit headers plus the CCU DSL frontend) is not
      installed on any host reachable from this workstream.  build.sh exits
      non-zero with that blocker; it never produces a library whose symbols only
      return UNSUPPORTED.
    manual_step: >-
      On an Ascend host that has the CANN ASC-COMM toolchain: source set_env.sh,
      write the device sources against the installed headers (checklists in
      kernels/asc_comm/aiv/README.md and kernels/asc_comm/ccu/README.md), then run
      ``bash kernels/asc_comm/build.sh --soc <soc>``.  The probe reads
      build/manifest.json, so a build that did not link stays missing; see
      dependencies/system/asc_comm.yaml for the blocker list.
    install:
      - "# BLOCKED until the device sources exist and the CANN ASC-COMM toolchain is installed"
      - "source /usr/local/Ascend/ascend-toolkit/set_env.sh"
      - "bash kernels/asc_comm/build.sh --soc Ascend950"
    check:
      type: kernel_artifact
      root: kernels/asc_comm
      build: build
      manifest: manifest.json
      libraries: [libasc_comm_kernels.so]
      engines: [AIV, CCU]
    runtime_paths:
      - kernels/asc_comm/build
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.2.RC1", "8.3.RC1"]
    notes: >-
      BLOCKED is recorded, not papered over: the entry exists so the matrix says why
      the transport family is degraded, instead of the case failing later as
      "unsupported by the adapter".  The artifact contract is the project's own:
      build/manifest.json names the library per engine, and
      baselines/l0/transport/kernel_artifacts.py additionally resolves the ABI
      symbols declared in common/abi.h.

  - id: l0-native-bridges
    category: C
    kind: native_build
    version: "in-repo"
    required_by: [l0_memory, l0_transport, l0_overlap]
    source_url: baselines/l0/transport/native/ (in this repository)
    commit: null
    license: Same as this repository
    optional: false
    installable: true
    install_reason: null
    manual_step: null
    install:
      - "bash baselines/l0/transport/native/build.sh"
      - "export EP_L0_TRANSPORT_LIBRARY=$PWD/baselines/l0/transport/native/build/libl0_transport_bridge.so"
    check:
      type: shared_library
      names: [libl0_transport_bridge.so, libl0_mem.so, libep_l0_udma.so]
      require_all: false
      search:
        - baselines/l0/transport/native/build
        - baselines/l0/memory/native/build
        - baselines/l0/shmem/native/build
    runtime_paths:
      - baselines/l0/transport/native/build
      - baselines/l0/memory/native/build
      - baselines/l0/shmem/native/build
    supported_soc: ["*"]
    supported_cann: ["8.2.RC1", "8.3.RC1"]
    notes: >-
      Three optional bridges, each with its own build.sh: the transport bridge
      (LINK-001..011), the memory MTE/UB bridge (MEM-002/003) and the UDMA
      endpoint (LINK-013 device variant).  A partial build is warn, not pass,
      because the missing bridge is what turns those cases into dependency_missing.

  # -- D. Multi-node launch and fabric -------------------------------------
  - id: mpi
    category: D
    kind: binary
    version: ">=4.1 (Open MPI) or >=3.4 (MPICH/Hydra)"
    required_by: [multinode, l0_transport]
    source_url: https://www.open-mpi.org/
    commit: null
    license: BSD-3-Clause (Open MPI) / MIT (MPICH)
    optional: false
    installable: true
    install_reason: null
    manual_step: null
    install:
      - "# needs root: pass --yes to scripts/install_deps.sh"
      - "apt-get install -y openmpi-bin libopenmpi-dev"
      - "# or, for a Hydra-based site: apt-get install -y mpich"
    check:
      type: binary
      binary: mpirun
      version_args: ["--version"]
      parse: mpi
    runtime_paths:
      - /usr/lib/x86_64-linux-gnu/openmpi/bin
    supported_soc: ["*"]
    supported_cann: ["*"]
    notes: >-
      The doctor records the implementation (Open MPI / MPICH-Hydra / Intel MPI)
      and the version line.  ``command -v mpirun`` is not evidence: the launch
      flags, the hostfile syntax and the binding model differ per implementation,
      and the multi-node scripts select flags from what the doctor reported.

  - id: multinode-env
    category: D
    kind: host_provided
    version: "deployment-managed"
    required_by: [multinode]
    source_url: launchers/ (in this repository)
    commit: null
    license: n/a (site configuration)
    optional: false
    installable: false
    install_reason: >-
      These are environment values for one deployment (rank addresses, visible
      devices, control-plane port).  There is nothing to install; a wrong value
      is a deployment error, not a missing package.
    manual_step: >-
      Export MASTER_ADDR, MASTER_PORT, ASCEND_RT_VISIBLE_DEVICES and
      HCCL_IF_BASE_PORT on every node before the launcher runs, and keep them
      identical across nodes that must join the same job.
    install:
      - "export MASTER_ADDR=<node0-ip> MASTER_PORT=6000"
      - "export ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7"
    check:
      type: env_var
      names: [MASTER_ADDR, MASTER_PORT, ASCEND_RT_VISIBLE_DEVICES, HCCL_IF_BASE_PORT]
      mode: all
    runtime_paths: []
    supported_soc: ["*"]
    supported_cann: ["*"]
    notes: >-
      A single-node run does not need any of these; the multinode group is the
      only group that requires them, so their absence fails exactly one row of
      the matrix.
    manual_step_owner: deployment

  - id: hccl-config
    category: D
    kind: host_provided
    version: "toolkit-managed"
    required_by: [multinode, l0_collectives]
    source_url: https://gitcode.com/cann/hccl
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      HCCL configuration selects the transport and the collective algorithm for a
      site.  It is environment policy shipped with the deployment, and overriding
      it from an installer would silently change what the L0 cases measure.
    manual_step: >-
      Set the site's HCCL_* values on every rank (HCCL_SOCKET_IFNAME,
      HCCL_INTRA_ROCE_ENABLE, HCCL_BUFFSIZE, HCCL_ALGO, HCCL_OP_EXPANSION_MODE).
      The L0 execution cases read them back as evidence for the requested
      execution resource.
    install:
      - "export HCCL_SOCKET_IFNAME=<fabric-interface>"
      - "export HCCL_ALGO=Ring   # or the site's documented algorithm"
    check:
      type: env_var
      names: [HCCL_SOCKET_IFNAME, HCCL_INTRA_ROCE_ENABLE, HCCL_BUFFSIZE, HCCL_ALGO, HCCL_OP_EXPANSION_MODE]
      mode: any
    runtime_paths: []
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      ``mode: any`` because the variables are alternatives: a site may select the
      fabric with HCCL_SOCKET_IFNAME and leave the algorithm to the runtime.  At
      least one must be set for the run to be attributable.
    manual_step_owner: deployment

  - id: device-permissions
    category: D
    kind: host_provided
    version: "driver-managed"
    required_by: *npu_only
    source_url: https://www.hiascend.com/hardware/firmware-drivers
    commit: null
    license: Proprietary (Huawei)
    optional: false
    installable: false
    install_reason: >-
      Device node ownership is created by the kernel driver and the container
      runtime.  chmod/chown from inside the container does not survive a driver
      reset, and there is nothing to install.
    manual_step: >-
      On the host: add the container user to the HwHiAiUser group
      (``usermod -aG HwHiAiUser <user>``), re-login, and start the container with
      --device /dev/davinci*:/dev/davinci* (or the Ascend container runtime
      flags).  Then confirm the device nodes are readable and writable by the
      run user.
    install:
      - "# host only: usermod -aG HwHiAiUser <user>"
      - "# container: docker run --device=/dev/davinci0 --device=/dev/davinci_manager ..."
    check:
      type: device_node
      patterns: ["/dev/davinci[0-9]*", "/dev/davinci_manager", "/dev/devmm_svm"]
      access: rw
      minimum: 1
    runtime_paths:
      - /dev/davinci0
      - /dev/davinci_manager
      - /dev/devmm_svm
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      The probe opens nothing and writes nothing: it checks existence and
      os.access(R_OK | W_OK).  A readable-but-not-writable node is reported as
      warn with the exact missing bit, because a run would fail much later while
      creating a context.
    manual_step_owner: host

  # -- E. Profiling and toolchain ------------------------------------------
  - id: msprof
    category: E
    kind: binary
    version: "toolkit-managed"
    required_by: [profiling, l0_overlap]
    source_url: https://www.hiascend.com/cann
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      msprof ships inside the CANN toolkit (tools/profiler).  There is no pip
      package, and a profiler built against another CANN release produces
      timelines the report cannot attribute.
    manual_step: >-
      Install the CANN toolkit on the host, source set_env.sh, and confirm
      ``msprof --version`` resolves.  Profiling must run on the host or in a
      container that bind-mounts /usr/local/Ascend.
    install:
      - "# comes with the CANN toolkit: source $ASCEND_HOME_PATH/set_env.sh"
      - "msprof --version"
    check:
      type: binary
      binary: msprof
      version_args: ["--version"]
      parse: none
      extra_paths:
        - $ASCEND_HOME_PATH/tools/profiler/bin
        - /usr/local/Ascend/ascend-toolkit/latest/tools/profiler/bin
    runtime_paths:
      - $ASCEND_HOME_PATH/tools/profiler/bin
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      The overlap family verifies concurrency from device events; without msprof
      those cases fall back to host timing and report overlap_verified=false,
      which is why this is a real dependency of l0_overlap and not only of the
      profiling stage.
    manual_step_owner: host

  - id: hccl-test
    category: E
    kind: binary
    version: "toolkit-managed"
    required_by: [l0_collectives]
    source_url: https://gitcode.com/cann/oam-tools
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      hccl_test is built from CANN oam-tools on the host and is not distributed
      as a wheel or a container package.  A prebuilt copy from another CANN
      release reports different accelerator options.
    manual_step: >-
      Build CANN oam-tools on the host (tools/hccl_test) with the installed
      toolkit, then either put its bin directory on PATH or set
      benchmark.native_hccl.binary / EP_HCCL_TEST_BINARY.  The doctor probes
      alltoall_test as the sentinel for the suite and parses ``--help`` for the
      accelerator options the L0 cases request.
    install:
      - "# host only: build CANN oam-tools, then export EP_HCCL_TEST_BINARY=<dir>/alltoall_test"
      - "$EP_HCCL_TEST_BINARY --help"
    check:
      type: binary
      binary: alltoall_test
      version_args: ["--help"]
      parse: none
      extra_paths:
        - $ASCEND_HOME_PATH/tools/hccl_test/bin
        - $ASCEND_HOME_PATH/tool/hccl_test/bin
    runtime_paths:
      - $ASCEND_HOME_PATH/tools/hccl_test/bin
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      baselines/l0/collectives/accelerator.py locates the same directories and
      parses the same --help output, so the doctor and the runner agree on what
      "the tool is installed" means.
    manual_step_owner: host

  - id: asc-comm-build-toolchain
    category: E
    kind: host_provided
    version: ">=3.20 (cmake) + any C++17 g++ + the CANN ASC-COMM toolchain"
    required_by: [l0_transport, l0_overlap]
    source_url: https://www.hiascend.com/cann
    commit: null
    license: CANN Open Software License Agreement v2.0
    optional: false
    installable: false
    install_reason: >-
      cmake and g++ are ordinary packages, but the piece that matters -- the
      ASC-COMM ops package and the ASC-COMM dialect of ccec -- is part of a CANN
      release that is not available here.  Installing two of three and calling it
      success is exactly the failure this catalog exists to prevent.
    manual_step: >-
      Install cmake and g++ from the image's package manager (scripts/install_deps.sh
      does this only with --yes), then install the CANN release component that
      provides the ASC-COMM toolchain and verify ``ccec --version``.  This is the
      documented blocker for the ASC-COMM kernel build.
    install:
      - "# needs root: pass --yes to scripts/install_deps.sh"
      - "apt-get install -y cmake g++"
      - "# plus the CANN ASC-COMM toolchain component (host install)"
    check:
      type: toolchain
      binaries: [cmake, g++, ccec]
      env: [ASCEND_HOME_PATH]
      subdirs:
        - compiler/ccec_compiler/bin
    runtime_paths:
      - $ASCEND_HOME_PATH/compiler/ccec_compiler/bin
      - /usr/bin/cmake
      - /usr/bin/g++
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.2.RC1", "8.3.RC1"]
    notes: >-
      BLOCKED for the ASC-COMM kernels: the toolchain probe lists every missing
      member separately (cmake / g++ / ccec) so the blocker is one line long
      instead of "the build does not work".
    manual_step_owner: host
