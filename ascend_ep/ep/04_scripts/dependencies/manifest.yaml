compatibility:
  schema_version: 1
  note: status=documented means the pairing comes from the vendor release matrix and has not been re-verified
    in this repository; status=probed means the doctor recorded it on this machine.  soc lists what the
    release is documented for; the doctor only compares strings it actually read (npu-smi / version.cfg).
  rows:
  - id: cann-8.2-torch-2.6
    cann: 8.2.RC1
    torch: 2.6.0
    torch_npu: 2.6.0.post3
    soc:
    - Ascend910B
    - Ascend910_93
    - Ascend950
    status: documented
    source_url: https://github.com/Ascend/pytorch
    evidence: Ascend/pytorch pairing for PyTorch 2.6.0 (torch_npu 2.6.0.post3 targets CANN 8.2.RC1).  Confirm
      against the site's CANN release notes before rollout; this repository has not recorded a run on
      this triple.
  - id: cann-8.1-torch-2.5
    cann: 8.1.RC1
    torch: 2.5.1
    torch_npu: 2.5.1.post1
    soc:
    - Ascend910B
    - Ascend910_93
    status: documented
    source_url: https://github.com/Ascend/pytorch
    evidence: Ascend/pytorch pairing for PyTorch 2.5.1.  Listed so the doctor can name an older but coherent
      stack instead of guessing at a mixed one.
  - id: cpu-torch-2.6
    cann: null
    torch: 2.6.0
    torch_npu: null
    soc: []
    status: probed
    source_url: https://github.com/pytorch/pytorch
    evidence: 'CPU venv used by tests/dependencies: torch 2.6.0+cpu, numpy 2.2.6, PyYAML 6.0.4, jsonschema
      4.26.0, no torch_npu, no CANN.  Every NPU dependency is expected to fail on this host.'
  - id: cann-9.2-torch-2.10
    cann: 9.2.1
    torch: 2.10.0
    torch_npu: 2.10.0.post4
    soc:
    - Ascend910_93
    - Ascend950
    status: documented
    source_url: https://github.com/penn513/ascendep/blob/main/ep/README.md
    evidence: ascendep recorded a 950DT EP2/EP8 run on CANN 9.2.1, torch 2.10.0+cpu and torch_npu 2.10.0.post4.
      This repository has not re-verified the triple; the doctor reports an unlisted pairing as skip,
      never as pass. The benchmark container image defines the actual stack.
  policy:
  - The torch base version is shared by the CPU and NPU paths; only the wheel index and the +cpu local
    tag differ.
  - torch_npu must match the installed torch exactly; a mismatch is reported as warn by the doctor and
    blocks every npu capability group.
  - A triple that matches no row is skip, never pass.
  shmem_tags:
    note: The SHMEM pin is a release tag, resolved to a commit at install time and recorded as evidence.
      A CANN row without a tag is not installable.
    8.2.RC1: 8.2.RC1
    8.3.RC1: 8.3.RC1
