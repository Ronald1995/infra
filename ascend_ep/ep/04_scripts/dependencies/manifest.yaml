      toolkit.  It has no independent release artifact, so there is nothing to
      install separately.
    manual_step: >-
      Install or upgrade the CANN toolkit on the host and re-source set_env.sh.
      The UB channel families the L0 transport cases name (AivUrmaChannel,
      AicpuTsUrmaChannel, CcuUrmaChannel) are created by this library, so a
      missing libhcomm.so makes every URMA/UB case unobservable.
    install:
      - "# comes with the CANN toolkit; verify, do not copy:"
      - "python -c \"import ctypes.util; print(ctypes.util.find_library('hcomm'))\""
    check:
      type: shared_library
      names: [libhcomm.so, libhcomm.dll]
    runtime_paths:
      - $ASCEND_HOME_PATH/lib64
      - $ASCEND_HOME_PATH/runtime/lib64
    supported_soc: [Ascend910B, Ascend910_93, Ascend950]
    supported_cann: ["8.1.RC1", "8.2.RC1", "8.3.RC1"]
    notes: >-
      The L0 transport layers report the URMA channel family and the
      CommProtocol value separately; both come from this library, so the doctor
      treats its absence as a hard failure for the transport family.
    manual_step_owner: host

