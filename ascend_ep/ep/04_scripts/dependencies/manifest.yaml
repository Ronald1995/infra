# CANN / PyTorch / torch_npu triples.  Never "latest": the doctor compares what
# it can read from the host against these rows and reports an unknown triple as
# skip (not pass), because an unlisted pairing is exactly the situation that
# produces "works until it silently does not".
compatibility:
  schema_version: 1
  note: >-
    status=documented means the pairing comes from the vendor release matrix and
    has not been re-verified in this repository; status=probed means the doctor
    recorded it on this machine.  soc lists what the release is documented for;
    the doctor only compares strings it actually read (npu-smi / version.cfg).
  rows:
    - id: cann-8.2-torch-2.6
      cann: "8.2.RC1"
      torch: "2.6.0"
      torch_npu: "2.6.0.post3"
      soc: [Ascend910B, Ascend910_93, Ascend950]
      status: documented
      source_url: https://github.com/Ascend/pytorch
      evidence: >-
        Ascend/pytorch pairing for PyTorch 2.6.0 (torch_npu 2.6.0.post3 targets
        CANN 8.2.RC1).  Confirm against the site's CANN release notes before
        rollout; this repository has not recorded a run on this triple.
    - id: cann-8.1-torch-2.5
      cann: "8.1.RC1"
      torch: "2.5.1"
      torch_npu: "2.5.1.post1"
      soc: [Ascend910B, Ascend910_93]
      status: documented
      source_url: https://github.com/Ascend/pytorch
      evidence: >-
        Ascend/pytorch pairing for PyTorch 2.5.1.  Listed so the doctor can name
        an older but coherent stack instead of guessing at a mixed one.
    - id: cpu-torch-2.6
      cann: null
      torch: "2.6.0"
      torch_npu: null
      soc: []
      status: probed
      source_url: https://github.com/pytorch/pytorch
      evidence: >-
        CPU venv used by tests/dependencies: torch 2.6.0+cpu, numpy 2.2.6,
        PyYAML 6.0.4, jsonschema 4.26.0, no torch_npu, no CANN.  Every NPU
        dependency is expected to fail on this host.
  policy:
    - "The torch base version is shared by the CPU and NPU paths; only the wheel index and the +cpu local tag differ."
    - "torch_npu must match the installed torch exactly; a mismatch is reported as warn by the doctor and blocks every npu capability group."
    - "A triple that matches no row is skip, never pass."

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
dependencies:
  # -- A. Python and CPU base stack ----------------------------------------
  - id: python
    category: A
    kind: host_provided
    version: ">=3.10,<3.13"
    required_by: *all
    source_url: https://www.python.org/downloads/
    commit: null
    license: PSF-2.0
    optional: false
    installable: false
    install_reason: >-
      The interpreter comes from the image or from the venv the operator creates;
      it is not a wheel, and installing a second interpreter inside a running
      environment would silently change what ``python`` means to the launcher.
    manual_step: >-
      Provision CPython 3.10-3.12 (pyenv 3.10.8, the distribution package, or the
      CPU venv at ascend_ep/ep/.cpu-venv) and run every command from the SCRIPTS
      root so that ``common``, ``baselines`` and ``operators`` resolve.
    install:
      - "# host/venv only: pyenv install 3.10.8 && pyenv local 3.10.8"
      - "python -c 'import sys; print(sys.version_info[:2])'"
    check:
      type: python_version
    runtime_paths:
      - "<sys.executable>"
      - "$VIRTUAL_ENV"
    supported_soc: ["*"]
    supported_cann: ["*"]
    notes: >-
      pyproject.toml declares requires-python >=3.10; 3.13 is excluded because the
      pinned torch 2.6 release has no 3.13 CPU wheel.  The code uses
      ``str | None`` annotations, so 3.9 is genuinely unsupported.
    manual_step_owner: host image

  - id: torch
    category: A
    kind: pip
    version: "==2.6.0"
    required_by: *all
    source_url: https://github.com/pytorch/pytorch
    commit: null
    license: BSD-3-Clause
    optional: false
    installable: true
    install_reason: null
    manual_step: null
    install:
      - "pip install --no-index --find-links $WHEELHOUSE torch==2.6.0"
      - "# online CPU wheel: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu"
    check:
      type: python_module
      module: torch
      distribution: torch
      import: true
    runtime_paths: []
    supported_soc: ["*"]
    supported_cann: ["*"]
    notes: >-
      The pinned base version is shared by the CPU and NPU paths; the CPU path
      installs the +cpu local-tag wheel, which PEP 440 accepts for ``==2.6.0``.
      The NPU path installs the same 2.6.0 torch next to torch_npu 2.6.0.post3.

  - id: numpy
    category: A
    kind: pip
    version: "==2.2.6"
    required_by: *all
    source_url: https://github.com/numpy/numpy
    commit: null
    license: BSD-3-Clause
    optional: false
    installable: true
    install_reason: null
    manual_step: null
    install:
      - "pip install --no-index --find-links $WHEELHOUSE numpy==2.2.6"
    check:
      type: python_module
      module: numpy
      distribution: numpy
      import: true
    runtime_paths: []
    supported_soc: ["*"]
    supported_cann: ["*"]
    notes: >-
      torch 2.6 requires numpy < 2.3; the pin is the version the CPU venv was
      validated with, not the newest release.

  - id: pyyaml
    category: A
    kind: pip
    version: "==6.0.4"
