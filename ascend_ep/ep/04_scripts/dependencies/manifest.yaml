  commit: null
  license: Proprietary (Huawei)
  optional: false
  installable: false
  install_reason: Device node ownership is created by the kernel driver and the container runtime.  chmod/chown
    from inside the container does not survive a driver reset, and there is nothing to install.
  manual_step: 'Nothing to install: the container image provides it. If the doctor reports a mismatch,
    fix the image tag, not this repository.'
  install:
