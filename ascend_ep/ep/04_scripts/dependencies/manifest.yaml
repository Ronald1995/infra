schema_version: 2
maintained_by: scripts/doctor.py (probes) + scripts/install_deps.sh (installs, via scripts/dependency_plan.py)
  + common/registry.py (operator -> environment)
matrix_owner: common/registry.py (operator ids must stay in sync)
vocabulary:
  check_status:
  - pass
  - warn
  - fail
  - skip
  matrix_status:
  - available
  - degraded
  - blocked
  kinds:
  - pip
  - native_build
  - host_provided
  - binary
  - python_import
  check_types:
  - python_version
  - python_module
  - shared_library
  - binary
  - env_var
  - device_node
  - driver
  - cann_home
  - toolchain
  - vendored_source
  - kernel_artifact
  ownerships:
  - in_repo
  - vendored
  - external
  - host
  pin_kinds:
  - commit
  - release_tag
  - in_repo
  - pip
  - system
  - none
  install_modes:
  - pip
  - source
  - system
  - manual
  - none
  provisioned_by:
  - container
  - deployment
  - repository
categories:
  A:
    id: python_base
    title: Python and CPU base stack
    installable_here: true
    note: The only category that must install offline on a CPU-only machine.
  B:
    id: cann
    title: CANN runtime, toolkit and the PyTorch device bridge
    installable_here: partial
    note: torch_npu and the ops packages are wheels or source builds; the driver, the toolkit, HCCL/HCOMM
      and npu-smi come from the host image and are never installed by this repository.
  C:
    id: communication
    title: Communication runtimes and custom kernels
    installable_here: partial
    note: SHMEM/DeepEP/npu_patch/MoonEP are source builds that need the target CANN toolkit; the ASC-COMM
      kernel tree is BLOCKED until the CANN ASC-COMM toolchain exists.
  D:
    id: multinode
    title: Multi-node launch and fabric
    installable_here: false
    note: MPI is a package; the environment, the HCCL configuration and the device permissions are deployment
      state.
  E:
    id: profiling
    title: Profiling and toolchain
    installable_here: false
    note: msprof and hccl_test ship inside CANN; the compiler toolchain comes from CANN plus the image's
      package manager.
profiles:
