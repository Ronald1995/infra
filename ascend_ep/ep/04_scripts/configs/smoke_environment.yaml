# Environment smoke configuration (Stage 1 of the NPU smoke).
#
# One config for the public L0 capability gate: it is deliberately *cheap*
# (one value per swept dimension, three iterations) because its job is to answer
# "can this host execute the hardware paths at all", not to measure them.
# Full Benchmark owns the dimension matrix.
#
# `suite_id: all` keeps the gate able to select every L0 family (collective,
# compute, overlap, memory, transport, execution); the concrete case list is
# declared in scripts/npu_smoke.py::STAGE1_CASES and validated against the case
# catalog, so a renamed case fails fast instead of silently shrinking the gate.
extends: base_benchmark.yaml
suite_id: all
device: npu

benchmark:
  levels: [L0]
  warmup: 1
  iterations: 3
  message_bytes: [4096, 1048576]
  outstanding: [1]
  peer_counts: [1]
  cores: [1]
  quiet_modes: [0]
  transport_mode: write
  transport:
    enabled: [hccs]
  execution:
    modes: [default]
  verification:
    enabled: true
    require_verified_for_comparison: true

profiling:
  enabled: false
