# Decode scenario: small token count, low latency, small messages, forward only.
#
# The case set comes from the `decode` suite in common/suites.py
# (COMM-001, COMM-003, MOE-001, LAYER-001).  This file only supplies the decod
# workload parameters; prefill.yaml uses the same cases with a large token count.
suite_id: decode
workload:
  tokens_per_rank: 16
  routing: balanced
  seed: 42

load_balance:
  enabled: false
  redundant_experts: 0

dedup:
  mode: none

benchmark:
  warmup: 20
  iterations: 50
  levels: [L1, L3, L4]
  rank_reduction: max
  phase: forward

profiling:
  enabled: false
  warmup: 1
  active: 3

backends:
  - deepep_lueelu
  - deepep_sglang
  - dispatch_ffn_combine_vllm_ascend
