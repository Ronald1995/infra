suite_id: dedup
workload:
  tokens_per_rank: 4096
  # dedup_controlled routes every token to the next rank, which is a remote
  # peer at every EP size; the remote-rank *logit bias* is a router-level
  # lever that needs an explicit rank-to-server map, so it is not declared
  # here (the plan supplies the topology; a standalone run uses EP8).
  routing: dedup_controlled
  seed: 42

load_balance:
  enabled: false
  redundant_experts: 0

benchmark:
  warmup: 20
  iterations: 50
  levels: [L1, L4]
  rank_reduction: max

profiling:
  enabled: false
  warmup: 1
  active: 3

backends:
  - moonep_server_dedup
  - alltoall_hccl

# None / Rank Dedup / Server Dedup.  The `none` point runs the measured control
# cases of the dedup suite (COMM-001 dispatch and MOE-001 forward, same routing
# trace) because no adapter implements a dedup case without dedup; the dedup
# cases themselves are reported as not_applicable in that mode.
matrix:
  - dedup: {mode: none}
  - dedup: {mode: rank}
  - dedup: {mode: server}
