# Overlap suite: the L0 concurrency family (OVERLAP-001..OVERLAP-009) together
# with the fused operator cases.  The L0 cases measure communication and compute
# on separate streams with device-event evidence; they are not replaced by the
# operator-internal fusion cases.
extends: base_benchmark.yaml
suite_id: overlap
benchmark:
  levels: [L0, L2, L3]
  message_bytes: [4096, 1048576, 16777216]
  outstanding: [1]
  peer_counts: [0]
  verification:
    enabled: true
    require_verified_for_comparison: true
operators: [alltoall_hccl, alltoallv_gmm_cann, ep_gmm_fused_lueelu, chunkmoe_fsdpturbo]
