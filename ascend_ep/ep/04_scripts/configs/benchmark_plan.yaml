# Unified EP benchmark plan.
#
# One plan -> EP8 x EP16 x EP32 x EP64 x EP128 manifest covering every case in the
# catalog and every registered EP operator.  All five sizes run the same catalog,
# the same suite scenarios and the same parameter matrix; only the environment
# (EP size, expert count, topology) and the capability verdict differ.
#
# Mode:
#   full_matrix  `all` expands the complete case catalog under the shared base
#                configuration, and every listed specialised suite adds its own
#                scenario configuration (workload, dimensions, planner/dedup
#                state).  Identical tasks are de-duplicated and keep the union of
#                their `suite_ids`; tasks whose parameters differ stay distinct.
#   catalog      legacy mode: each listed suite expands on its own, `all` uses
#                the base configuration only.  It stays the default for plan
#                files that do not declare a mode.
#
# CLI:
#   python run_benchmark.py plan  --plan configs/benchmark_plan.yaml
#   python run_benchmark.py run   --plan configs/benchmark_plan.yaml
#   python run_benchmark.py run   --plan configs/benchmark_plan.yaml --ep-size 64
#   python run_benchmark.py run   --plan configs/benchmark_plan.yaml --suite overlap
#   python run_benchmark.py run   --plan configs/benchmark_plan.yaml \
#       --cases COMM-001,COMM-003 --operators deepep_ascend,moonep
schema_version: 1

plan:
  name: ep-l0-l4-matrix
  mode: full_matrix
  ep_sizes: [8, 16, 32, 64, 128]
  operators: all
  levels: [L0, L1, L2, L3, L4]
  # `all` = the complete case catalog under the base configuration.
  # Every other entry loads its specialised scenario configuration, so decode,
  # prefill, training tail, high throughput, scaling, topology, load balance,
  # dedup and quantized all contribute their own parameter matrix.
  suites:
    - all
    - hardware
    - memory
    - transport
    - collectives
    - overlap
    - decode
    - prefill
    - training_tail
    - high_throughput
    - strong_scaling
    - weak_scaling
    - topology
    - load_balance
    - dedup
    - quantized
    - routing_imbalance
    - straggler
  # `dedupe` keeps the legacy L0 IDs (HW-007/HW-008/HW-009/HW-012) out of the
  # task list because their canonical case is already covered.  Use `run` to
  # execute them as their own task.
  aliases: dedupe

  # Layer 1: shared measurement definitions.
  base_config: base_benchmark.yaml
  # Layer 2: EP environment only (no case scope).
  # Unified baseline: three experts per rank at every size (24/48/96/192/384).
  # ep64_bf16_384.yaml is the historical six-experts-per-rank profile; it is a
  # different model profile and is run as its own plan, never spliced in here.
  ep_configs:
    8: ep8_bf16.yaml
    16: ep16_bf16.yaml
    32: ep32_bf16.yaml
    64: ep64_bf16.yaml
    128: ep128_bf16.yaml
  # Layer 3: scenario layer.  A suite file only contributes scenario sections;
  # EP size, TP size, device, model shape and rank mapping stay owned by the EP
  # environment above (see common/config.py::suite_scenario).
  suite_configs:
    hardware: hardware.yaml
    memory: memory.yaml
    transport: transport.yaml
    collectives: collectives.yaml
    overlap: overlap.yaml
    decode: decode.yaml
    prefill: prefill.yaml
    training_tail: training_tail.yaml
    high_throughput: high_throughput.yaml
    strong_scaling: strong_scaling.yaml
    weak_scaling: weak_scaling.yaml
    topology: topology.yaml
    load_balance: load_balance.yaml
    dedup: dedup.yaml
    quantized: quantized.yaml
    routing_imbalance: routing_imbalance.yaml
    straggler: straggler.yaml

  # Rank-to-server map used when an EP environment file does not carry one.
  # 8 ranks per server, 16 ranks per supernode: EP8 is one board, EP64 spans 8
  # servers, EP128 spans 16 servers / 8 supernodes.
  #
  # This is a *derived* layout, not a discovered one: every composed point records
  # `topology.source: plan` and `verified: false`.  Paste a real map as
  # `rank_to_server: [...]` (one entry per rank, or {domain: [ranks]}) plus
  # `server_to_supernode: {...}` and set `verified: true` once it was read from
  # the actual deployment.  A map supplied by the EP environment file always wins.
  topology:
    server_size: 8
    supernode_size: 16
    verified: false

execution:
  # A failing case never stops the remaining cases of the same EP size, and a
  # failing EP size never stops the other EP sizes.
  fail_fast: false
  continue_on_unsupported: true
  continue_on_error: true
  run_ep_sizes_sequentially: true
  # Full Matrix: every planned task must reach an explicit terminal status.
  # `not_run` is not a pass and makes the run report `completion_status:
  # incomplete` instead of a silent success.
  require_complete_execution: true

report:
  compare_ep_sizes: true
  compare_operators: true
  generate_coverage_matrix: true
