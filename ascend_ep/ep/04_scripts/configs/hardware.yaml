# L0 hardware suite: framework collectives (HW-001..HW-006) and the standalone
# compute baselines (HW-010..HW-011).
#
# The suite is selected by case *category*, not by this filename, and it does not
# contain the memory / transport / execution / overlap families: those have their
# own suites and their own YAML files.
extends: base_benchmark.yaml
suite_id: hardware
benchmark:
  levels: [L0]
  warmup: 5
  iterations: 20
  message_bytes: [4096, 65536, 1048576]
  compute:
    fixed_shape: {m: 8192, k: 7168, n: 3072, groups: 8}
  verification:
    enabled: true
    require_verified_for_comparison: true
