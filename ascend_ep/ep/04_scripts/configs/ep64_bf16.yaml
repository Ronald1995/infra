# EP64 environment profile: unified baseline, three experts per rank
# (192 global experts).  The historical 384-expert profile is
# ep64_bf16_384.yaml and is reported separately.
extends: base_benchmark.yaml
distributed:
  ep_size: 64
  tp_size: 1

model:
  num_experts: 192
  top_k: 6

workload:
  tokens_per_rank: 4096
  routing: balanced
  seed: 42

profiling:
  enabled: false
  warmup: 1
  active: 3

backends:
  - alltoall_hccl
  - deepep_ascend
  - moonep
  - alltoallv_gmm_cann
  - megamoe_lueelu
