# EP8 environment profile.
#
# This file only describes the EP environment (EP size, model shape, expert
# count, device).  It must not select cases or levels: the benchmark plan decides
# the scope and every EP size runs the same catalog.
extends: base_benchmark.yaml
distributed:
  ep_size: 8
  tp_size: 1

model:
  num_experts: 24
  top_k: 6

workload:
  tokens_per_rank: 4096
  routing: balanced
  seed: 42

profiling:
  enabled: true
  warmup: 1
  active: 3

backends:
  - alltoall_hccl
  - deepep_ascend
  - moonep
  - alltoallv_gmm_cann
  - megamoe_lueelu
