suite_id: load_balance
workload:
  tokens_per_rank: 4096
  routing: hot_expert
  router_bias: rotating_hot_expert
  seed: 42

load_balance:
  enabled: true
  redundant_experts: 3

dedup:
  mode: none

benchmark:
  warmup: 20
  iterations: 50
  levels: [L1, L3, L4]
  rank_reduction: max

profiling:
  enabled: false
  warmup: 1
  active: 3

backends:
  - moonep_dynamic_planner
  - alltoall_hccl

# Planner On, inference and training.  The Planner Off control for LAYER-003 is
# the `fixed_owner` variant that `alltoall_hccl` runs in the same plan, so both
# sides of the comparison are measured under one routing trace.
matrix:
  - benchmark: {phase: train}
  - benchmark: {phase: forward}
