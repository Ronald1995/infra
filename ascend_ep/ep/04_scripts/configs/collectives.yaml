# L0 collectives suite: EXEC-001..EXEC-006 executed by the native HCCL test tool
# (AllToAll, AllToAllV, AllGather, ReduceScatter, AllReduce, P2P), swept over the
# accelerator modes the installed tool actually offers.
#
# Framework collectives (HW-001..HW-006) belong to the `hardware` suite; this
# suite only selects the communication-execution cases.
extends: base_benchmark.yaml
suite_id: collectives
benchmark:
  levels: [L0]
  warmup: 5
  iterations: 20
  message_bytes: [1048576, 16777216, 268435456, 1073741824]
  execution:
    modes: [default, aicpu_ts, aiv, aiv_only, ccu_sched]
  native_hccl:
    # Point this at the built CANN oam-tools hccl_test directory or a single
    # binary; without it EXEC-* reports dependency_missing.
    binary: null
    launcher: null
    mpi: true
  verification:
    enabled: true
    require_verified_for_comparison: true
