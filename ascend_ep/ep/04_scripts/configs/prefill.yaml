# Prefill scenario: large token count, large communication, batch expert GEMM.
#
# The case set is the same `decode`/`prefill` suite listing
# (COMM-001, COMM-003, MOE-001, LAYER-001); only the workload below differs.
suite_id: prefill
workload:
  tokens_per_rank: 4096
  routing: balanced
  seed: 42

load_balance:
  enabled: false
  redundant_experts: 0

dedup:
  mode: none

benchmark:
  warmup: 20
  iterations: 50
  levels: [L1, L2, L3, L4]
  rank_reduction: max
  phase: forward

profiling:
  enabled: false
  warmup: 1
  active: 3

backends:
  - deepep_ascend
  - deepep_lueelu
  - alltoallv_gmm_cann
  - megamoe_cann
