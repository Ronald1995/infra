# L0 native transport suite: LINK-001..LINK-013.
#
# One case is one (mechanism, execution resource) pair.  The peer sweep has two
# purposes: a fixed fan-out (1/2/4 peers) compares a single link across EP sizes,
# and peer_count=0 ("all other ranks") measures how the mechanism scales with the
# whole EP group.  Missing native bridges or SHMEM runtimes are reported as
# dependency_missing, never replaced by another mechanism.
extends: base_benchmark.yaml
suite_id: transport
benchmark:
  levels: [L0]
  warmup: 3
  iterations: 10
  message_bytes: [4096, 65536, 1048576, 16777216, 268435456, 1073741824]
  outstanding: [1, 4]
  peer_counts: [1, 2, 4, 0]
  cores: [1, 2, 4]
  quiet_modes: [0, 1]
  transport_mode: write
  transport:
    enabled: [ub_memory, urma, ub_ctp, ub_rtp, shmem_mte, shmem_udma]
    library: null
    # ring: rank-rotated deterministic peers.
    # same_server / cross_server: topology-aware peer selection; they are only
    # generated for a focused transport run because they multiply the sweep.
    peer_policy: ring
    peer_policies: [ring, same_server, cross_server]
  verification:
    enabled: true
    require_verified_for_comparison: true
