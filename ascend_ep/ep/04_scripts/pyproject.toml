[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-ep-benchmark"
version = "0.2.0"
description = "Distributed expert parallel benchmarks for Ascend and CPU validation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
charts = ["matplotlib>=3.7"]

[project.scripts]
ep-benchmark = "run_benchmark:main"

[tool.setuptools]
py-modules = ["run_benchmark"]

[tool.setuptools.packages.find]
include = ["analysis*", "baselines*", "benchmarks*", "common*", "metrics*", "operators*", "profiling*", "reporting*", "schemas*", "scripts*"]
exclude = ["*.tests"]

[tool.setuptools.package-data]
operators = ["registry.yaml", "*/config.yaml"]
schemas = ["*.json"]
# The vendored ascendep adapters are a PEP 420 namespace package (`ep/` without
# `__init__.py`), so setuptools does not discover them: list the files explicitly or
# a wheel install would drop the tree and every ascendep-backed operator would
# report `source_unavailable`.
"operators.vendor.ascendep" = [
    "VENDOR.json",
    "README.md",
    "ep/*.py",
    "ep/*/demo.py",
]
dependencies = ["*.yaml", "python/*.txt", "system/*.yaml"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "operators"]
markers = ["npu: native tests requiring an explicitly provided Ascend runtime"]
