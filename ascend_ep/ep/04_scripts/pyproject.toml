[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "infra-ep-benchmark"
version = "0.2.0"
description = "Distributed expert parallel benchmarks for Ascend and CPU validation"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
charts = ["matplotlib>=3.7"]

[project.scripts]
ep-benchmark = "run_benchmark:main"

[tool.setuptools]
py-modules = ["run_benchmark"]

[tool.setuptools.packages.find]
include = ["analysis*", "baselines*", "benchmarks*", "common*", "metrics*", "operators*", "profiling*", "reporting*", "schemas*"]
exclude = ["*.tests"]

[tool.setuptools.package-data]
operators = ["registry.yaml", "*/config.yaml"]
schemas = ["*.json"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "operators"]
markers = ["npu: native tests requiring an explicitly provided Ascend runtime"]
